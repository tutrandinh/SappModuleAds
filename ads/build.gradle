apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

android {
    namespace 'com.ads.sapp'
    compileSdk 35

    defaultConfig {
        minSdkVersion 24
        targetSdk 35
        versionCode 100
        versionName "1.0.0"
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        productFlavors {
        }
        buildTypes {
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'androidx.lifecycle:lifecycle-process:2.2.0'
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'

    //admob
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.2.0'

    //mediation admob
    implementation 'com.google.ads.mediation:facebook:6.20.0.0'
    implementation 'com.google.ads.mediation:applovin:13.3.1.1'
    implementation 'com.google.ads.mediation:vungle:7.5.0.1'

    def lifecycle_version = "2.0.0"
    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime:$lifecycle_version"
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:$lifecycle_version"

    implementation 'com.google.android.gms:play-services-vision:20.1.3'

    implementation platform('com.google.firebase:firebase-bom:33.16.0')
    implementation 'com.google.firebase:firebase-analytics'

    def multidex_version = "2.0.1"
    implementation "androidx.multidex:multidex:$multidex_version"
    def billing_version = "5.0.0"
    implementation "com.android.billingclient:billing:$billing_version"
    implementation "com.google.guava:guava:27.1-android"

    implementation 'com.google.android.gms:play-services-appset:16.1.0'
    implementation 'com.google.android.gms:play-services-basement:18.7.1'
    implementation "androidx.core:core-ktx:1.6.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.0.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation 'com.airbnb.android:lottie:5.0.2'

    //Ads call api
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.squareup.retrofit2:retrofit:2.1.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.1.0'

    implementation group: 'commons-codec', name: 'commons-codec', version: '1.5'

    //Google User Messaging Platform SDK
    implementation("com.google.android.ump:user-messaging-platform:3.2.0")

    //adjust
    implementation 'com.adjust.sdk:adjust-android:4.38.0'

}

publishing {
    publications {
        release(MavenPublication) {
            release(MavenPublication) {
                afterEvaluate {
                    from components.findByName("release") // Sửa lại từ `default` thành `release`
                }
                groupId = "com.haiyan"
                artifactId = "ads"
                version = "1.0.2"
            }
        }
    }
    repositories {
        maven {
            url "http://localhost:8081/repository/android-libs/"
            allowInsecureProtocol true
            credentials {
                username System.getenv("NEXUS_USER") ?: "admin"
                password System.getenv("NEXUS_PASS") ?: "admin@123"
            }
        }
    }
}

